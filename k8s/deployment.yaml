apiVersion: apps/v1
kind: Deployment
metadata:
  name: md-to-pdf
  labels:
    app: md-to-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: md-to-pdf
  template:
    metadata:
      labels:
        app: md-to-pdf
    spec:
      containers:
      - name: md-to-pdf
        image: jgarw/md-to-pdf:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: md-to-pdf-secrets
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: outputs
          mountPath: /app/outputs
      volumes:
      - name: uploads
        emptyDir: {}
      - name: outputs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: md-to-pdf-service
spec:
  type: NodePort
  selector:
    app: md-to-pdf
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080